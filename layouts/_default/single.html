{{ define "main" }}
  <article class="site-container content-page" aria-labelledby="page-title">
    <header class="page-header">
      <h1 id="page-title">{{ .Title }}</h1>
      {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
